<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Confirm your email</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f8f3ec; font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #2a1e17">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f8f3ec">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px">
            <tr>
              <td style="padding: 0 4px 20px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #431b20">Kuwala Books</td>
            </tr>
            <tr>
              <td style="background: #ffffff; border-radius: 12px; padding: 32px 28px; box-shadow: 0 1px 3px rgba(42, 30, 23, 0.08)">
                <h1 style="margin: 0 0 12px; font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em">Confirm your email</h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #5b4a3c">Tap the button to finish setting up your account.</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius: 999px; background: #722f37">
                      <a
                        href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
                        style="display: inline-block; padding: 13px 26px; font-size: 15px; font-weight: 500; color: #ffffff; text-decoration: none; border-radius: 999px"
                        >Confirm email</a
                      >
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.6; color: #776453">
                  Or paste this link into your browser:<br />
                  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="color: #722f37; word-break: break-all"
                    >{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email</a
                  >
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 4px 0; font-size: 12px; line-height: 1.6; color: #776453">
                You signed up as {{ .Email }}. Didn’t sign up? Ignore this email.<br />
                <a href="{{ .SiteURL }}" style="color: #776453">kuwalabooks.com</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
